Chương 6.1–6.6, tr. 81–127`,theme:`dark`,transcriptNotes:`Năm giai đoạn: Nhận diện thị trường → Khác biệt hóa → Phát triển sản phẩm chiến lược → Thương mại hóa → Lan tỏa. Giống như quy trình mở quán ăn: sản phẩm ra mắt là lúc tiếp tục học hỏi.`},{id:4,slideNumber:4,section:`PHẦN I: MỞ ĐẦU VÀ TÁC ĐỘNG CỦA THỊ TRƯỜNG`,sectionNumber:`PHẦN I`,title:`Thị trường tác động đến đổi mới như thế nào?`,subtitle:`Phối thức 4P, hai cấp độ quyết định và bài học từ 110 dự án đổi mới`,presenter:`Người 2`,presenterId:2,duration:`1:40`,references:`Giáo trình tr. 82–83; Khảo sát 110 dự án R&D`,theme:`light`,transcriptNotes:`Đổi mới diễn ra ở cả 4P (Product, Price, Place, Promotion). Phân biệt Marketing chiến lược (vào thị trường/phân khúc nào) và Marketing chiến thuật (giá, thông điệp, kênh).`},{id:5,slideNumber:5,section:`PHẦN I: MỞ ĐẦU VÀ TÁC ĐỘNG CỦA THỊ TRƯỜNG`,sectionNumber:`PHẦN I`,title:`Công nghệ và thị trường quyết định cách đổi mới`,subtitle:`Ma trận 2×2 độ trưởng thành và quy trình 5 bước học hỏi của IDEO`,presenter:`Người 2`,presenterId:2,duration:`2:00`,references:`Giáo trình tr. 83–85; Case study IDEO Design Thinking`,theme:`dark`,transcriptNotes:`Hai chiều: Trưởng thành công nghệ × Trưởng thành thị trường. 4 tình huống: Khác biệt hóa, Kiến trúc, Công nghệ, Phức tạp. Quy trình IDEO: Hiểu - Quan sát - Nguyên mẫu - Thử nghiệm - Thương mại hóa.`},{id:6,slideNumber:6,section:`PHẦN II: KHÁC BIỆT HÓA VÀ PHÁT TRIỂN SẢN PHẨM CHIẾN LƯỢC`,sectionNumber:`PHẦN II`,title:`Khác biệt hóa phải tạo ra giá trị`,subtitle:`Chất lượng tương đối, giá trị cảm nhận và bài học lịch sử từ Nokia`,presenter:`Người 1`,presenterId:1,duration:`1:35`,references:`Giáo trình tr. 86–89; Khảo sát PIMS 3.000 đơn vị kinh doanh`,theme:`light`,transcriptNotes:`Khác biệt hóa không phải nhồi nhét thông số. Khách hàng cân nhắc chất lượng tương đối so với giá và đối thủ. Nokia từng dẫn đầu với GSM nhưng suy giảm khi thị hiếu sang nắp gập & camera.`},{id:7,slideNumber:7,section:`PHẦN II: KHÁC BIỆT HÓA VÀ PHÁT TRIỂN SẢN PHẨM CHIẾN LƯỢC`,sectionNumber:`PHẦN II`,title:`QFD: Từ nhu cầu đến thiết kế sản phẩm`,subtitle:`Mô hình Ngôi nhà Chất lượng và 3 nhóm thuộc tính Kano`,presenter:`Người 3`,presenterId:3,duration:`1:35`,references:`Giáo trình tr. 89–91; Nghiên cứu triển khai Toyota & Kano Model`,theme:`dark`,transcriptNotes:`QFD dịch tiếng nói khách hàng (VOC) sang thông số kỹ thuật. 3 nhóm thuộc tính: Phải có (Must-be), Một chiều (One-dimensional), Gây thích thú (Delighters). Không thể dùng delighter bù cho lỗi cốt lõi.`},{id:8,slideNumber:8,section:`PHẦN II: KHÁC BIỆT HÓA VÀ PHÁT TRIỂN SẢN PHẨM CHIẾN LƯỢC`,sectionNumber:`PHẦN II`,title:`Phân khúc thị trường tiêu dùng (B2C)`,subtitle:`Hành vi, lối sống, mức độ tham gia và bài học thử nghiệm Persil Power`,presenter:`Người 3`,presenterId:3,duration:`1:35`,references:`Giáo trình tr. 91–94; Case Persil Power 1994 (Unilever)`,theme:`light`,transcriptNotes:`Nhân khẩu học đơn lẻ không đủ giải thích hành vi. Mức độ tham gia quyết định nỗ lực tìm kiếm thông tin. Persil Power thử nghiệm 60.000 hộ Bắc Âu nhưng thất bại vì không đại diện thói quen Nam Âu và loại vải.`},{id:9,slideNumber:9,section:`PHẦN II: KHÁC BIỆT HÓA VÀ PHÁT TRIỂN SẢN PHẨM CHIẾN LƯỢC`,sectionNumber:`PHẦN II`,title:`Phân khúc thị trường doanh nghiệp (B2B)`,subtitle:`Mạng lưới mua tổ chức, phân khúc theo lợi ích và hiệu ứng Mondex`,presenter:`Người 3`,presenterId:3,duration:`1:35`,references:`Giáo trình tr. 94–97; Case máy CNC & Ví điện tử Mondex`,theme:`dark`,transcriptNotes:`4 vai trò trong B2B: Bên mua, Người sử dụng, Gatekeeper, Người ảnh hưởng. Mua máy CNC có thể vì độ chính xác hoặc vì tiết kiệm chi phí. Mondex chỉ thành công khi tích hợp thẻ sinh viên & đa đối tác.`},{id:10,slideNumber:10,section:`PHẦN II: KHÁC BIỆT HÓA VÀ PHÁT TRIỂN SẢN PHẨM CHIẾN LƯỢC`,sectionNumber:`PHẦN II`,title:`Năm hướng phát triển sản phẩm chiến lược`,subtitle:`Từ thiết kế cốt lõi đến mở rộng phân khúc và đổi mới gián đoạn`,presenter:`Người 3`,presenterId:3,duration:`1:50`,references:`Giáo trình tr. 97–101, 112–113; Christensen Jobs-to-be-Done`,theme:`navy`,transcriptNotes:`5 hướng: Thêm tính năng hiện tại, Lên phân khúc cao, Xuống phân khúc thấp, Tính năng tùy chọn, Sản phẩm hỗn hợp. Cân nhắc đổi mới duy trì vs gián đoạn; giải quyết việc khách hàng cần làm (JTBD).`},{id:11,slideNumber:11,section:`PHẦN III: THƯƠNG MẠI HÓA SẢN PHẨM ĐỔI MỚI`,sectionNumber:`PHẦN III`,title:`Từ công nghệ đến sản phẩm thương mại`,subtitle:`Hệ thống sản phẩm hoàn chỉnh và ba yếu tố nhận thức khi mua công nghệ cao`,presenter:`Người 2`,presenterId:2,duration:`1:35`,references:`Giáo trình tr. 101–103; Afuah (Tài sản bổ trợ chuỗi giá trị)`,theme:`dark`,transcriptNotes:`Công nghệ lõi (như pin, chip) chưa bán được nếu thiếu hệ điều hành, sạc, bảo hành, dịch vụ. Khách hàng quyết định dựa trên: Sự khác biệt công nghệ, Tốc độ lỗi thời, và Chi phí chuyển đổi (Switching Costs).`},{id:12,slideNumber:12,section:`PHẦN III: THƯƠNG MẠI HÓA SẢN PHẨM ĐỔI MỚI`,sectionNumber:`PHẦN III`,title:`Khai thác tài sản trí tuệ và trường hợp ARM`,subtitle:`5 điều kiện bảo hộ sáng chế, 4 phương pháp định giá và mô hình nhượng quyền`,presenter:`Người 2`,presenterId:2,duration:`2:10`,references:`Giáo trình tr. 103–107; ARM Holdings Licensing Case`,theme:`navy`,transcriptNotes:`5 điều kiện bảo hộ: Tính mới, Bước phát minh, Ứng dụng công nghiệp, Đối tượng hợp lệ, Tiết lộ đầy đủ. 4 cách định giá (Bản quyền thị trường, Quy tắc 25%, ROI, Chia sẻ lợi nhuận). ARM chỉ thiết kế kiến trúc và thu 0.05-2.5$ mỗi chip.`},{id:13,slideNumber:13,section:`PHẦN III: THƯƠNG MẠI HÓA SẢN PHẨM ĐỔI MỚI`,sectionNumber:`PHẦN III`,title:`Thương mại hóa sản phẩm phức tạp`,subtitle:`Marketing thám hiểm, vai trò người dùng dẫn đầu và bài học EMI CT Scanner`,presenter:`Người 3`,presenterId:3,duration:`1:55`,references:`Giáo trình tr. 107–115; Case EMI vs GE/Siemens (Von Hippel Lead Users)`,theme:`dark`,transcriptNotes:`Phức tạp kỹ thuật ≠ phức tạp thị trường. Người dùng dẫn đầu (Lead users) đi trước 7 năm nhưng không đại diện toàn bộ. EMI phát minh CT scanner nhưng thua GE/Siemens vì thiếu dịch vụ và mạng lưới hỗ trợ bệnh viện.`},{id:14,slideNumber:14,section:`PHẦN III: THƯƠNG MẠI HÓA SẢN PHẨM ĐỔI MỚI`,sectionNumber:`PHẦN III`,title:`Marketing sản phẩm đổi mới: Giảm bất định`,subtitle:`Hành trình chuyển đổi tâm lý từ giải thích lợi ích đến xây dựng niềm tin`,presenter:`Người 3`,presenterId:3,duration:`1:25`,references:`Giáo trình tr. 101–115; Khung quản trị bất định thị trường`,theme:`light`,transcriptNotes:`Marketing sản phẩm mới không chỉ là quảng cáo. Cần: Giải thích công dụng → Cho dùng thử → Giảm rủi ro → Hỗ trợ chuyển đổi → Thu thập phản hồi để liên tục hoàn thiện giải pháp.`},{id:15,slideNumber:15,section:`PHẦN IV: SỰ LAN TỎA VÀ DỰ BÁO ĐỔI MỚI`,sectionNumber:`PHẦN IV`,title:`Năm đặc điểm ảnh hưởng đến sự lan tỏa`,subtitle:`Khung lý thuyết Rogers về các yếu tố quyết định tốc độ chấp nhận`,presenter:`Người 2`,presenterId:2,duration:`1:35`,references:`Giáo trình tr. 115–117; Rogers Diffusion of Innovations (2003)`,theme:`dark`,transcriptNotes:`5 thuộc tính: Lợi thế tương đối (Relative Advantage), Tính tương thích (Compatibility), Độ phức tạp (Complexity), Khả năng dùng thử (Trialability), Khả năng quan sát (Observability). Ví dụ xe đạp điện dễ nhớ.`},{id:16,slideNumber:16,section:`PHẦN IV: SỰ LAN TỎA VÀ DỰ BÁO ĐỔI MỚI`,sectionNumber:`PHẦN IV`,title:`Đường cong chữ S và các nhóm chấp nhận`,subtitle:`Phân biệt đường cong tích lũy và phân phối mật độ 5 nhóm của Rogers`,presenter:`Người 2`,presenterId:2,duration:`1:30`,references:`Giáo trình tr. 117–118; Rogers (2003)`,theme:`light`,transcriptNotes:`Đường cong chữ S là tích lũy (chậm - bùng nổ - bão hòa). 5 nhóm Rogers: Đổi mới (2.5%), Chấp nhận sớm (13.5%), Đa số sớm (34%), Đa số muộn (34%), Chậm chạp (16%). Tỷ lệ lý thuyết, không phải công thức cố định cho mọi ngành.`},{id:17,slideNumber:17,section:`PHẦN IV: SỰ LAN TỎA VÀ DỰ BÁO ĐỔI MỚI`,sectionNumber:`PHẦN IV`,title:`Dự báo sự lan tỏa của đổi mới`,subtitle:`Mô hình Phía cầu, Cơ chế Phía cung và bài học dự báo Apple Newton`,presenter:`Người 2`,presenterId:2,duration:`2:25`,references:`Giáo trình tr. 118–126; Mô hình Bass, Probit, Bayesian & Case Apple Newton`,theme:`dark`,transcriptNotes:`Phía cầu: Dịch bệnh, Bass, Probit, Bayesian. Phía cung: Tán thành, Phổ biến, Ứng dụng, Truyền thông. Apple Newton dự báo 400.000 thực tế chỉ bán 70.000. Cần cẩn trọng phân tích mẫu số chuyển đổi (ví dụ: 1000 tiếp cận → 90 dùng lại).`},{id:18,slideNumber:18,section:`PHẦN V: NGHIÊN CỨU TÌNH HUỐNG FE CREDIT`,sectionNumber:`PHẦN V`,title:`FE CREDIT: Cơ hội đổi mới từ nhu cầu thị trường`,subtitle:`Dịch vụ tài chính số, trải nghiệm minh bạch và hệ sinh thái tiếp cận vốn`,presenter:`Người 1`,presenterId:1,duration:`1:40`,references:`Tiểu luận Chương 6 tr. 27–28; FE CREDIT Báo cáo thường niên 2024`,theme:`teal`,transcriptNotes:`Khách hàng vay trả góp cần: minh bạch lãi phí, dễ theo dõi lịch trả nợ, hỗ trợ khi gặp khó. FE ONLINE 2.0 giải quyết điểm nghẽn tương tác. Khác biệt giữa người vay cá nhân và đối tác điểm bán.`},{id:19,slideNumber:19,section:`PHẦN V: NGHIÊN CỨU TÌNH HUỐNG FE CREDIT`,sectionNumber:`PHẦN V`,title:`FE CREDIT: Hoạt động và kết quả năm 2024`,subtitle:`Phân tách chuẩn xác chỉ số tài chính phục hồi và quy mô tương tác số`,presenter:`Người 3`,presenterId:3,duration:`1:40`,references:`Báo cáo thường niên VPBank 2024; Công bố tài chính riêng FE CREDIT; Vietnamnet 2025`,theme:`dark`,transcriptNotes:`Giải ngân >43.000 tỷ (+40%), Dư nợ tăng 10.3%. LNTT: 512 tỷ (VPBank BCTN) / gần 515 tỷ (công bố riêng kiểm toán). Chatbot: >130.000 người/năm, >200.000 phiên/tháng. Tách riêng chỉ số tài chính và kênh số, không ngộ nhận tương quan nhân quả đơn lẻ.`},{id:20,slideNumber:20,section:`PHẦN V: NGHIÊN CỨU TÌNH HUỐNG FE CREDIT`,sectionNumber:`PHẦN V`,title:`FE CREDIT: Bài học quản trị đổi mới`,subtitle:`Khung 3 cấp độ: Hoạt động triển khai, Giá trị khách hàng và Hiệu quả kinh tế`,presenter:`Người 3`,presenterId:3,duration:`1:35`,references:`Tiểu luận tr. 29–30; Khung đánh giá hiệu quả đổi mới dịch vụ tài chính`,theme:`light`,transcriptNotes:`Đổi mới số không chỉ là đưa giao diện lên app. Phải phối hợp công nghệ - thẩm định - dịch vụ - quản trị rủi ro tín dụng. Đánh giá ở 3 cấp độ: Triển khai → Trải nghiệm giá trị thực → Kết quả tài chính bền vững.`},{id:21,slideNumber:21,section:`PHẦN VI: KẾT LUẬN VÀ THẢO LUẬN`,sectionNumber:`PHẦN VI`,title:`Đổi mới là quá trình học hỏi liên tục`,subtitle:`Năm quyết định quản trị cốt lõi và câu hỏi gợi mở cho hội trường`,presenter:`Người 1`,presenterId:1,duration:`1:20`,references:`Tổng hợp Chương 6 Giáo trình Đổi mới & Sáng tạo HUB`,theme:`navy`,transcriptNotes:`Đổi mới không phải cuộc thi xem ai có công nghệ mới nhất. Đó là chuỗi quyết định: Hiểu nhu cầu - Khác biệt hóa - Chọn phân khúc - Thương mại hóa - Lan tỏa. Câu hỏi thảo luận: App nhiều lượt tải nhưng ít người quay lại có xem là thành công?`}],x=e=>e?.replace(/([a-z0-9])([A-Z])/g,`$1-$2`).toLowerCase();function S(e,t,n=[]){if(t==null)throw Error(`[lucide]: iconNode is required when icon name is used`);return{name:x(e),size:24,node:t,...n.length>0?{aliases:n}:{}}}var C=e=>{let t=``,n=!1;for(let r of e)r===`-`||r===`_`||r<=` `?n=t.length>0:(t.length===0?t+=r.toLowerCase():t+=n?r.toUpperCase():r,n=!1);return t},w=e=>{let t=C(e);return t.charAt(0).toUpperCase()+t.slice(1)},T=(...e)=>e.filter((e,t,n)=>!!e&&e.trim()!==``&&n.indexOf(e)===t).join(` `).trim(),E={xmlns:`http://www.w3.org/2000/svg`,width:24,height:24,viewBox:`0 0 24 24`,fill:`none`,stroke:`currentColor`,"stroke-width":2,"stroke-linecap":`round`,"stroke-linejoin":`round`};function D(e){return e!=null}function O(e,t={}){let n=t.attributeNames??{},r=e=>n[e]??e,i=e.size??e.width??E.width,a=e.size??e.height??E.height,o=e.aliases?.filter(e=>typeof e==`string`&&e.trim()!==``).map(e=>`lucide-${e}`)??[],s=[...e.name?[`lucide-${e.name}`]:[],...o],c=t.className?.split(` `).filter(Boolean)??[],l=t.includeDefaultClasses===!1?T(...c):T(`lucide`,...s,...c),u=t.absoluteStrokeWidth?Number(t.strokeWidth??E[`stro
